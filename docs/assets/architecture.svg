<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">NZ electricity analytics architecture</title><desc id="desc">Official EA data flows through Python ingestion, PostgreSQL, SQL data quality and analytical marts to findings and Power BI. Power BI imports the reporting marts.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#49828a"/></marker></defs><rect width="1200" height="300" rx="12" fill="#f3f7f8"/><text x="24" y="35" font-family="Arial" font-size="22" font-weight="700" fill="#173641">Official data to reviewable analytical reporting</text><rect x="24" y="70" width="150" height="115" rx="8" fill="white" stroke="#85b4ba"/><text x="99" y="101" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#173641">Official EA data</text><text x="99" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#40545c">Prices, volumes</text><text x="99" y="154" text-anchor="middle" font-family="Arial" font-size="14" fill="#40545c">generation, NSP</text><path d="M174 125 H187" fill="none" stroke="#49828a" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="70" width="150" height="115" rx="8" fill="white" stroke="#85b4ba"/><text x="265" y="101" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#173641">Python ingestion</text><text x="265" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#40545c">Discover, hash</text><text x="265" y="154" text-anchor="middle" font-family="Arial" font-size="14" fill="#40545c">parse, validate</text><path d="M340 125 H353" fill="none" stroke="#49828a" stroke-width="2" marker-end="url(#arrow)"/><rect x="356" y="70" width="150" height="115" rx="8" fill="white" stroke="#85b4ba"/><text x="431" y="101" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#173641">PostgreSQL</text><text x="431" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#40545c">Staging and</text><text x="431" y="154" text-anchor="middle" font-family="Arial" font-size="14" fill="#40545c">core fact grains</text><path d="M506 125 H519" fill="none" stroke="#49828a" stroke-width="2" marker-end="url(#arrow)"/><rect x="522" y="70" width="150" height="115" rx="8" fill="white" stroke="#85b4ba"/><text x="597" y="101" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#173641">SQL quality</text><text x="597" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#40545c">29 rules</text><text x="597" y="154" text-anchor="middle" font-family="Arial" font-size="14" fill="#40545c">warnings retained</text><path d="M672 125 H685" fill="none" stroke="#49828a" stroke-width="2" marker-end="url(#arrow)"/><rect x="688" y="70" width="150" height="115" rx="8" fill="white" stroke="#85b4ba"/><text x="763" y="101" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#173641">Analytical marts</text><text x="763" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#40545c">Scope-safe KPIs</text><text x="763" y="154" text-anchor="middle" font-family="Arial" font-size="14" fill="#40545c">release gates</text><path d="M838 125 H851" fill="none" stroke="#49828a" stroke-width="2" marker-end="url(#arrow)"/><rect x="854" y="70" width="150" height="115" rx="8" fill="white" stroke="#85b4ba"/><text x="929" y="101" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#173641">Findings</text><text x="929" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#40545c">Read-only SQL</text><text x="929" y="154" text-anchor="middle" font-family="Arial" font-size="14" fill="#40545c">evidence + caveats</text><path d="M1004 125 H1017" fill="none" stroke="#49828a" stroke-width="2" marker-end="url(#arrow)"/><rect x="1020" y="70" width="150" height="115" rx="8" fill="white" stroke="#85b4ba"/><text x="1095" y="101" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#173641">Power BI</text><text x="1095" y="132" text-anchor="middle" font-family="Arial" font-size="14" fill="#40545c">Five pages</text><text x="1095" y="154" text-anchor="middle" font-family="Arial" font-size="14" fill="#40545c">59 DAX measures</text><path d="M763 185 V220 H1095 V188" fill="none" stroke="#49828a" stroke-width="2" marker-end="url(#arrow)"/><text x="880" y="244" text-anchor="middle" font-family="Arial" font-size="14" fill="#40545c">Power BI imports reporting marts; findings inform the report design</text><text x="24" y="280" font-family="Arial" font-size="14" fill="#40545c">Immutable source lineage • UTC / local interval identity • Effective geography • Unknown retained</text></svg>